<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="220" rx="20" fill="#020617"/>
  <!-- Decorative Grid / Lines -->
  <path d="M 0,110 L 1200,110 M 150,0 L 150,220 M 1050,0 L 1050,220" stroke="#1E293B" stroke-width="1"/>
  <!-- Glowing Orbs -->
  <circle class="orb" cx="150" cy="110" r="80" fill="#22D3EE" opacity="0.08" filter="url(#glow)"/>
  <circle class="orb orb2" cx="1050" cy="110" r="80" fill="#C084FC" opacity="0.08" filter="url(#glow)"/>
  <!-- Glowing Borders -->
  <rect class="border" x="2" y="2" width="1196" height="216" rx="18" fill="none" stroke="url(#borderGradient)" stroke-width="3" opacity="0.8"/>
  <style>
    .orb { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .orb2 { animation-delay: 2s; }
    .border { animation: glow 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .06; transform: scale(1); } 50% { opacity: .18; transform: scale(1.25); } }
    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .orb, .border { animation: none; } }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <rect x="500" y="40" width="200" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="0.2em">ULTIMATE PLAYBOOK</text>
  <!-- Title -->
  <text x="600" y="130" text-anchor="middle" fill="url(#textGradient)" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="0.1em">HACKATHON ESSENTIALS</text>
  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-weight="500" font-size="15" letter-spacing="0.05em">A CURATED BLUEPRINT FOR RAPID PROTOTYPING &amp; SHIPPING</text>
</svg>
